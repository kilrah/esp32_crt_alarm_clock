; Copy this file to secrets.ini and fill in your values.
; secrets.ini is git-ignored. Values may contain spaces; avoid double quotes (") and backslashes (\).
; All of these are only defaults: WiFi and the token can be changed on the web page later.
[secrets]
wifi_ssid = YourNetworkName
wifi_password = YourPassword
; Protects the web firmware update and PlatformIO OTA uploads, and is the password of the
; fallback access point (if 8+ characters). Leave empty to disable (not recommended).
ota_password = changeme
; Home Assistant long-lived access token (Profile -> Security). May be left empty and
; entered on the web page instead.
ha_token =
