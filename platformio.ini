; ESP32 composite-video weather clock
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev_pal
; WiFi / OTA / Home Assistant credentials live in secrets.ini (git-ignored).
; Copy secrets.example.ini to secrets.ini on a fresh checkout.
extra_configs = secrets.ini

[env:esp32dev_pal]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
board_build.flash_mode = qio
board_upload.flash_size = 4MB
; Two 1.9 MB app slots so firmware updates over the network (web page / OTA) fit
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
build_flags =
    -D CORE_DEBUG_LEVEL=1
    '-DWIFI_SSID="${secrets.wifi_ssid}"'
    '-DWIFI_PASSWORD="${secrets.wifi_password}"'
    '-DOTA_PASSWORD="${secrets.ota_password}"'
    '-DHA_TOKEN="${secrets.ha_token}"'
lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    bblanchon/ArduinoJson@^7.3.1
    earlephilhower/ESP8266Audio@1.9.9

; Radio audio without the PCM5102 (see AUDIO_OUTPUT in include/config.h):
;   esp32dev_pal-dac: second internal DAC on GPIO26 (8-bit)
;   esp32dev_pal-pwm: LEDC PWM on GPIO26 (312.5 kHz)
; Both need an RC low-pass filter + coupling capacitor in front of the amplifier.
[env:esp32dev_pal-dac]
extends = env:esp32dev_pal
build_flags = ${env:esp32dev_pal.build_flags} -D AUDIO_OUTPUT=1

[env:esp32dev_pal-pwm]
extends = env:esp32dev_pal
build_flags = ${env:esp32dev_pal.build_flags} -D AUDIO_OUTPUT=2

; Upload over WiFi:  pio run -e esp32dev_pal-ota -t upload
; upload_port can also be the device's IP address if .local names don't resolve.
[env:esp32dev_pal-ota]
extends = env:esp32dev_pal
upload_protocol = espota
upload_port = weatherclock.local
upload_flags =
    --auth=${secrets.ota_password}

[env:esp32dev_pal-dac-ota]
extends = env:esp32dev_pal-ota
build_flags = ${env:esp32dev_pal-dac.build_flags}

[env:esp32dev_pal-pwm-ota]
extends = env:esp32dev_pal-ota
build_flags = ${env:esp32dev_pal-pwm.build_flags}
